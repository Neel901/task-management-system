<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1><span class="brand-mark">✓</span> TaskFlow</h1>
    <p class="muted">Sign in to manage your tasks</p>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email</small>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password is required</small>
      }
    </label>

    <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="muted center">No account? <a routerLink="/register">Register</a></p>

    <div class="demo">
      <span class="muted">Demo accounts (after <code>npm run seed</code>):</span>
      <div class="demo-buttons">
        <button type="button" class="btn btn-ghost" (click)="useDemo('manager@example.com')">Manager</button>
        <button type="button" class="btn btn-ghost" (click)="useDemo('asha@example.com')">Employee</button>
      </div>
    </div>
  </form>
</div>
