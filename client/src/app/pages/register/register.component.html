<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1><span class="brand-mark">✓</span> TaskFlow</h1>
    <p class="muted">Create an employee account</p>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <label>
      Full name
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="field-error">Name is required</small>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email</small>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">At least 6 characters</small>
      }
    </label>

    <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="muted center">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
